name: Windows Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Vorhandener Release-Tag (z. B. v1.4.2)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref }}

      - name: Node.js einrichten
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Tag und Paketversion prüfen
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Tag $env:RELEASE_TAG passt nicht zu package.json Version $packageVersion"
          }

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Tests ausführen
        run: npm test

      - name: Signierten Installer bauen
        run: npm run dist:win -- --publish never
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      - name: Release und Update-Dateien veröffentlichen
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/ProjectBuilder-Setup-$version.exe"
          $blockmap = "$installer.blockmap"

          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            for ($attempt = 1; $attempt -le 4; $attempt++) {
              gh release create $env:RELEASE_TAG `
                --title $version `
                --generate-notes
              if ($LASTEXITCODE -eq 0) { break }
              if ($attempt -eq 4) { throw "Release konnte nach vier Versuchen nicht angelegt werden." }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }

          gh release upload $env:RELEASE_TAG `
            $installer `
            $blockmap `
            "release/latest.yml" `
            "certificates/ProjectBuilder-CodeSigning.cer" `
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
